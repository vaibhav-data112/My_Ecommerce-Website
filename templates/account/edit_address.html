{% extends 'account/layout.html' %}
{% block title %}Edit Address — Karvii{% endblock %}

{% block account_content %}
<h2>Edit Address</h2>

<form method="post" class="acct-form">
    <div class="form-row-2">
        <div class="form-group">
            <label class="form-label">Full Name <span class="required">*</span></label>
            <input type="text" name="full_name" class="form-input"
                   value="{{ addr['full_name'] }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">Phone <span class="required">*</span></label>
            <input type="tel" name="phone" class="form-input"
                   value="{{ addr['phone'] }}" required>
        </div>
    </div>
    <div class="form-group">
        <label class="form-label">Address Line <span class="required">*</span></label>
        <input type="text" name="address_line" class="form-input"
               value="{{ addr['address_line'] }}" required>
    </div>
    <div class="form-row-3">
        <div class="form-group">
            <label class="form-label">City <span class="required">*</span></label>
            <input type="text" name="city" class="form-input" value="{{ addr['city'] }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">State <span class="required">*</span></label>
            <input type="text" name="state" class="form-input" value="{{ addr['state'] }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">Pincode <span class="required">*</span></label>
            <input type="text" name="pincode" class="form-input" value="{{ addr['pincode'] }}"
                   maxlength="6" required>
        </div>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('account.addresses') }}" class="btn btn-outline">Cancel</a>
    </div>
</form>
{% endblock %}
