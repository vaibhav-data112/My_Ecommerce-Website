{% extends 'base.html' %}
{% block title %}Product Not Found — My Shop{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;margin:2rem auto;text-align:center">
    <p style="font-size:3rem;margin-bottom:1rem">&#128247;</p>
    <h2 style="margin-bottom:.75rem">Product not found</h2>
    <p style="color:#666;margin-bottom:1.5rem">
        We couldn't find that product. It may have been removed or the link is incorrect.
    </p>
    <a href="{{ url_for('catalog.product_list') }}" class="btn btn-primary">Browse all products</a>
</div>
{% endblock %}
