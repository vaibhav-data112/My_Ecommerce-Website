{% extends 'base.html' %}
{% block title %}Sign Up — My Shop{% endblock %}

{% block content %}
<div style="max-width:420px;margin:0 auto">
    <div class="card">
        <h2 style="margin-bottom:1.5rem;text-align:center">Create an account</h2>

        <a href="/login/google" class="btn btn-google">
            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.5 30.2 0 24 0 14.6 0 6.6 5.5 2.7 13.5l7.9 6.1C12.5 13.2 17.8 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17z"/>
                <path fill="#FBBC05" d="M10.6 28.4A14.6 14.6 0 0 1 9.5 24c0-1.5.3-3 .7-4.4l-7.9-6.1A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.7 10.7l7.9-6.3z"/>
                <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.2 0-11.5-4.2-13.4-9.9l-7.9 6.1C6.6 42.5 14.6 48 24 48z"/>
            </svg>
            Continue with Google
        </a>

        <div class="divider">or</div>

        <form method="post" action="/signup">
            <div class="form-group">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" value="{{ name or '' }}" required autofocus>
            </div>
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required>
            </div>
            <div class="form-group">
                <label for="password">Password <span style="font-weight:400;color:#999">(min 8 characters)</span></label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn btn-primary">Create account</button>
        </form>

        <div class="link-row">
            Already have an account? <a href="/login">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
